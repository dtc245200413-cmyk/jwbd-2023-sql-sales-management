<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Sơ đồ CSDL QuanLyBanHang</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 30px;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 28px 32px 28px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.08);
      border: 1px solid #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg width="1280" height="780" viewBox="0 0 1280 780" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; border-radius: 12px;">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    .tbl-title { font-size: 14px; font-weight: 800; fill: #ffffff; }
    .col-pk { font-size: 12.5px; font-weight: 800; fill: #b91c1c; }
    .col-fk { font-size: 12.5px; font-weight: 700; fill: #2563eb; }
    .col-norm { font-size: 12.5px; fill: #1e293b; }
    .col-type { font-size: 11.5px; fill: #64748b; text-anchor: end; font-family: monospace; }
  </style>

  <!-- Title Banner -->
  <rect x="30" y="20" width="1220" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" />
  <text x="640" y="50" font-size="16" font-weight="800" fill="#166534" text-anchor="middle">
    SƠ ĐỒ CƠ SỞ DỮ LIỆU QUẢN LÝ BÁN HÀNG (DATABASE: QuanLyBanHang)
  </text>

  <!-- TABLE 1: Customer -->
  <g transform="translate(60, 110)" filter="url(#shadow)">
    <rect width="280" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" />
    <path d="M 0,8 Q 0,0 8,0 L 272,0 Q 280,0 280,8 L 280,36 L 0,36 Z" fill="#1e40af" />
    <text x="18" y="24" class="tbl-title">👤 Customer (Khách hàng)</text>
    
    <text x="18" y="62" class="col-pk">🔑 cID (PK, AI)</text>
    <text x="262" y="62" class="col-type">INT NOT NULL</text>
    <line x1="12" y1="74" x2="268" y2="74" stroke="#f1f5f9" />

    <text x="18" y="98" class="col-norm">cName</text>
    <text x="262" y="98" class="col-type">VARCHAR(25) NOT NULL</text>
    <line x1="12" y1="110" x2="268" y2="110" stroke="#f1f5f9" />

    <text x="18" y="134" class="col-norm">cAge</text>
    <text x="262" y="134" class="col-type">TINYINT</text>
  </g>

  <!-- TABLE 2: Order -->
  <g transform="translate(480, 110)" filter="url(#shadow)">
    <rect width="310" height="185" rx="8" fill="#ffffff" stroke="#cbd5e1" />
    <path d="M 0,8 Q 0,0 8,0 L 302,0 Q 310,0 310,8 L 310,36 L 0,36 Z" fill="#b45309" />
    <text x="18" y="24" class="tbl-title">🧾 `Order` (Hóa đơn mua hàng)</text>
    
    <text x="18" y="62" class="col-pk">🔑 oID (PK, AI)</text>
    <text x="292" y="62" class="col-type">INT NOT NULL</text>
    <line x1="12" y1="74" x2="298" y2="74" stroke="#f1f5f9" />

    <text x="18" y="98" class="col-fk">🔗 cID (FK)</text>
    <text x="292" y="98" class="col-type">INT NOT NULL</text>
    <line x1="12" y1="110" x2="298" y2="110" stroke="#f1f5f9" />

    <text x="18" y="134" class="col-norm">oDate</text>
    <text x="292" y="134" class="col-type">DATETIME NOT NULL</text>
    <line x1="12" y1="146" x2="298" y2="146" stroke="#f1f5f9" />

    <text x="18" y="170" class="col-norm">oTotalPrice</text>
    <text x="292" y="170" class="col-type">INT NULL</text>
  </g>

  <!-- TABLE 3: Product -->
  <g transform="translate(930, 360)" filter="url(#shadow)">
    <rect width="290" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" />
    <path d="M 0,8 Q 0,0 8,0 L 282,0 Q 290,0 290,8 L 290,36 L 0,36 Z" fill="#0f766e" />
    <text x="18" y="24" class="tbl-title">📦 Product (Sản phẩm)</text>
    
    <text x="18" y="62" class="col-pk">🔑 pID (PK, AI)</text>
    <text x="272" y="62" class="col-type">INT NOT NULL</text>
    <line x1="12" y1="74" x2="278" y2="74" stroke="#f1f5f9" />

    <text x="18" y="98" class="col-norm">pName</text>
    <text x="272" y="98" class="col-type">VARCHAR(25) NOT NULL</text>
    <line x1="12" y1="110" x2="278" y2="110" stroke="#f1f5f9" />

    <text x="18" y="134" class="col-norm">pPrice</text>
    <text x="272" y="134" class="col-type">INT NOT NULL (>= 0)</text>
  </g>

  <!-- TABLE 4: OrderDetail -->
  <g transform="translate(480, 360)" filter="url(#shadow)">
    <rect width="310" height="155" rx="8" fill="#ffffff" stroke="#cbd5e1" />
    <path d="M 0,8 Q 0,0 8,0 L 302,0 Q 310,0 310,8 L 310,36 L 0,36 Z" fill="#c2410c" />
    <text x="18" y="24" class="tbl-title">📝 OrderDetail (Chi tiết hóa đơn)</text>
    
    <text x="18" y="62" class="col-pk">🔑 oID (PK, FK)</text>
    <text x="292" y="62" class="col-type">INT NOT NULL</text>
    <line x1="12" y1="74" x2="298" y2="74" stroke="#f1f5f9" />

    <text x="18" y="98" class="col-pk">🔑 pID (PK, FK)</text>
    <text x="292" y="98" class="col-type">INT NOT NULL</text>
    <line x1="12" y1="110" x2="298" y2="110" stroke="#f1f5f9" />

    <text x="18" y="134" class="col-norm">odQTY</text>
    <text x="292" y="134" class="col-type">INT NOT NULL (&gt; 0)</text>
  </g>

  <!-- RELATIONSHIP CONNECTORS -->
  <!-- Customer.cID -> Order.cID (1 : N) -->
  <path d="M 340,172 L 410,172 L 410,208 L 480,208" fill="none" stroke="#1e40af" stroke-width="2.5" />
  <circle cx="340" cy="172" r="4" fill="#1e40af" />
  <polygon points="475,203 485,208 475,213" fill="#1e40af" />

  <!-- Order.oID -> OrderDetail.oID (1 : N) -->
  <path d="M 635,295 L 635,360" fill="none" stroke="#b45309" stroke-width="2.5" />
  <circle cx="635" cy="295" r="4" fill="#b45309" />
  <polygon points="630,355 635,365 640,355" fill="#b45309" />

  <!-- Product.pID -> OrderDetail.pID (1 : N) -->
  <path d="M 930,422 L 860,422 L 860,458 L 790,458" fill="none" stroke="#0f766e" stroke-width="2.5" />
  <circle cx="930" cy="422" r="4" fill="#0f766e" />
  <polygon points="795,453 785,458 795,463" fill="#0f766e" />

  <!-- SUMMARY INFO CARD -->
  <g transform="translate(60, 560)">
    <rect width="1160" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="25" y="30" font-size="13.5" font-weight="800" fill="#0f172a">CHI TIẾT RÀNG BUỘC TOÀN VẸN VÀ MỐI QUAN HỆ CƠ SỞ DỮ LIỆU:</text>
    <text x="35" y="58" font-size="12" fill="#334155">• 1 Khách hàng (Customer) có thể có nhiều Hóa đơn (Order) - Quan hệ 1 : N (Khóa ngoại cID ở bảng Order).</text>
    <text x="35" y="82" font-size="12" fill="#334155">• 1 Hóa đơn có thể có nhiều Sản phẩm và 1 Sản phẩm có thể nằm trong nhiều Hóa đơn - Quan hệ N : N.</text>
    <text x="35" y="106" font-size="12" fill="#334155">• Bảng OrderDetail là bảng trung gian có khóa chính phức hợp (oID, pID) và lưu số lượng mua odQTY (odQTY &gt; 0).</text>
    <text x="35" y="130" font-size="12" fill="#334155">• Từ khóa 'Order' được đặt trong dấu backticks `Order` để tương thích hoàn toàn chuẩn cú pháp MySQL ANSI.</text>
    <text x="35" y="154" font-size="12" font-weight="700" fill="#16a34a">✓ Mô hình thỏa mãn dạng chuẩn 3NF, đáp ứng đầy đủ yêu cầu nghiệp vụ quản lý bán hàng.</text>
  </g>
</svg>

  </div>
</body>
</html>
